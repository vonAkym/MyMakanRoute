# GitHub Actions (CI = continuous integration): on every push and pull request, GitHub
# installs the packages and runs the same checks you run locally, so a broken change is
# caught before it is merged. No database, internet service or secret is needed, because
# the tests mock the database (see backend/tests/setup.js).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, format, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  web:
    name: Web (lint, format, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # GitHub Pages demo: only after both test jobs pass, and only for pushes to the working
  # branch or main. Builds the web app in demo mode (npm run build:pages: the 55 sample places
  # run in the browser, no backend) and puts the result on the gh-pages branch, which GitHub
  # Pages serves at https://vonakym.github.io/MyMakanRoute/.
  pages:
    name: Publish demo to GitHub Pages
    needs: [backend, web]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/feature/feasibility-core' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:pages
      # 404.html = index.html, so links like /MyMakanRoute/discover open the app instead of
      # GitHub's "page not found". .nojekyll tells Pages to serve the files as they are.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - name: Push the build to the gh-pages branch
        working-directory: web/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish demo from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
