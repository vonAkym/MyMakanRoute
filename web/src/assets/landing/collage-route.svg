<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
  <!-- Original artwork (MyMakanRoute): a stylised George Town street map with a food hopping route. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262019"/>
      <stop offset="1" stop-color="#14110d"/>
    </linearGradient>
  </defs>
  <rect width="360" height="260" fill="url(#bg)"/>
  <!-- sea -->
  <path d="M260 0h100v260H300c-20-40-10-90 -30-130S250 30 260 0z" fill="#1d2a33"/>
  <!-- streets -->
  <g stroke="#3d342a" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M0 60h270M0 140h290M0 214h300M70 0v260M160 0v260M230 0l20 260"/>
  </g>
  <g stroke="#4a4035" stroke-width="2" fill="none">
    <path d="M0 100h260M110 0v260M200 0v260"/>
  </g>
  <!-- park -->
  <rect x="84" y="74" width="62" height="52" rx="10" fill="#26402a"/>
  <!-- the route -->
  <path d="M40 200C70 170 90 160 116 150s50-60 74-70 50 30 60 60" fill="none" stroke="#e8873a" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- stops -->
  <g>
    <circle cx="40" cy="200" r="16" fill="#e8873a"/>
    <circle cx="40" cy="200" r="6" fill="#0b0b0b"/>
    <circle cx="190" cy="80" r="16" fill="#e8873a"/>
    <circle cx="190" cy="80" r="6" fill="#0b0b0b"/>
    <path d="M250 112c-14 0-24 10-24 24 0 18 24 40 24 40s24-22 24-40c0-14-10-24-24-24z" fill="#e8873a"/>
    <circle cx="250" cy="136" r="8" fill="#0b0b0b"/>
  </g>
  <g fill="#ffffff" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600">
    <text x="28" y="236">1</text><text x="185" y="52">2</text><text x="246" y="198">3</text>
  </g>
</svg>
